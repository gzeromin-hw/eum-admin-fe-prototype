          required: false,
          description: '분류',
          enum: [자재, 선행, 사외, 공정, 안전, 품질, 용접, 도장, 설계],
        }
      risk:
        {
          type: string,
          required: false,
          description: '리스크 설명 (예: LD 노출, 일정 지연)',
        }

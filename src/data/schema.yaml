extraction_guidelines:
  - "엔티티 이름은 구체적이고 식별 가능하게 추출하라 (예: '블록' ✗ → 'Block A10 기관실 하부' ✓)"
  - 'description 필드는 문서 맥락에서 해당 엔티티를 설명하는 1~2문장을 한국어로 생성하라'
  - '블록 코드(Block A10, ER-B10 등)는 반드시 Block 엔티티로 추출하라'
  - '호선 번호(H2357, 2357호선 등)는 Project 엔티티로 추출하고, 선종 레이블이 언급되면 함께 기록하라'
  - '공장명이 언급되면 InsideShop/OutsideShop/OverseaShop 중 적절한 타입으로 추출하고, 용도 플래그(isAssemblyShop 등)를 설정하라'
  - "계획일·실적일이 언급되면 ISO 8601 날짜 문자열로 기록하라 (예: '2024-06-03')"
  - '주차(YYWW) 표현이 있으면 ISO 주차 기준으로 날짜 범위를 산출하라 (예: 2420주 = 2024-05-13 ~ 2024-05-17)'
  - '속성명은 has 접두사 규칙을 따르라 (예: hasPlannedStartDate, hasCode)'
  - '관계 방향은 반드시 Plan/Actual 노드가 시작점이 되어야 한다 (예: MonthlyAssemblyPlan → Block)'
  - "NDT 검사(RT, UT, MT, PT) 결과가 언급되면 Issue 엔티티로 추출하고 category를 '품질'로 설정하라"
  - '동일 엔티티가 여러 번 언급되면 하나로 통합하라'
  - '스키마에 정의되지 않은 새로운 유형이 발견되면 candidate_type에 제안 유형명을 기재하라'
  - '확실하지 않은 관계는 추출하지 마라 — 정밀도(Precision)가 재현율(Recall)보다 중요하다'
  - '지연 관련 정보가 있으면 Issue로 추출하고, 영향받는 Block/Project와 관계를 설정하라'
  - 'OOS(해외) 공장 코드가 언급되면 OverseaShop 타입으로 추출하라 (DSC, NGV, DMC, DBJ, ANG)'

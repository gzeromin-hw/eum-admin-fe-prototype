        {
          type: string,
          required: false,
          description: '발생 주차 (YYWW, 예: 2518)',
        }
      '~id':
        { type: string, required: false, description: '내부 ID (issue::UUID)' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: true
    state_fields:
      status: { type: string, enum: [Open, 'In Progress', Resolved, Closed] }
    examples:
      - '2530~2535 구간 6척 LD 노출'
      - 'H5508 B#11D 탑재 전 발판 철거를 위한 주요 관리점'
      - 'H.4393 C/Guide 용접 중점관리 요청'


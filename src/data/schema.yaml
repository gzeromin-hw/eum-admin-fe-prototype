version: '1.1'
domain: 'shipbuilding_block_production'
description: |
  조선소 블록 생산 계획/실적 관리 도메인 스키마.
  Neo4j 온톨로지 기반으로 선박 건조 과정의 계획 수립, 실적 추적,
  지연 관리, 이슈 관리를 포괄한다.

# ═══════════════════════════════════════════════════════════════
# 도메인 컨텍스트 — 추출 시 LLM이 참조할 배경 지식
# ═══════════════════════════════════════════════════════════════

domain_context:
  production_flow:
    description: |
      선박 건조 공정 흐름: 설계 → 절단 → 소조립 → 중조립 → 대조립 → PE(선행의장) → 탑재 → 의장 → 시운전 → 인도.
      각 단계별 계획(Plan)과 실적(Actual) 노드가 존재하며, 블록/프로젝트/공장에 매핑된다.

  ship_type_labels:
    description: 'Project 노드는 선종에 따라 추가 레이블을 가짐'
    types:
      ChemicalTanker: '케미컬 탱커'
      ContainerCarrier: '컨테이너선'
      OilCarrier: '유조선'
      LPGCarrier: 'LPG 운반선'
      BulkCarrier: '벌크선'
      OreBulkOilCarrier: '광유겸용선(OBO)'
      SpecialShip: '특수선'

  project_identification:
    hull_number: 'Project.uri 끝에 포함된 숫자 (예: Proj_2357 → 2357호선)'
    ship_type: 'Project 노드의 추가 레이블로 판별 (ChemicalTanker, ContainerCarrier 등)'

  shop_type_classification:
    description: '공장 노드(InsideShop/OutsideShop/OverseaShop)의 용도별 분류'
    boolean_note: "불리언 플래그는 STRING 타입으로 'True'/'False' (대문자 첫 글자). 쿼리 시 toLower() 변환 후 비교 권장."
    rules:
      조립공장: "InsideShop + toLower(isAssemblyShop)='true'"
      도장공장: "(InsideShop|OutsideShop|OverseaShop) + toLower(isPaintingShop)='true'"
      절단공장: "(InsideShop|OutsideShop) + toLower(isCuttingShop)='true'"
      안벽공장: "OutsideShop + toLower(isErectionShop)='true'"
      의장공장: "(InsideShop|OutsideShop) + toLower(isOutfittingShop)='true'"
    overseas_shop_codes: ['DSC', 'NGV', 'DMC', 'DBJ', 'ANG']
    shop_name_field: 'comment'
    shop_code_field: 'hasCode'

  date_conventions:
    format: "ISO 8601 문자열 (예: '2024-06-03')"
    week_format: 'YYWW (예: 2420 = 2024년 20주차 = 2024-05-13 ~ 2024-05-17)'
    null_handling: '날짜 속성은 NULL 가능 → IS NOT NULL 체크 필수'
    type_casting: '문자열 → date() 함수로 변환 후 비교'

  delay_calculation:
    start_delay: '실제착수일 > 계획착수일이면 착수 지연'
    completion_delay: '실제종료일 > 계획종료일이면 완료 지연'
    actual_end_date_resolution: 'coalesce(hasAdjustedActualEndDate, hasActualEndDateByStaff)'
    delay_days_formula: 'duration.between(계획일, 실적일).days'

  relationship_direction_rules:
    description: '모든 Plan/Actual 노드가 관계의 시작점(source)'
    patterns:
      - '(Plan/Actual)-[:ASSIGNEDTOSHOP]->(Shop)'
      - '(Plan/Actual)-[:PLANNEDONBLOCK]->(Block)'
      - '(Plan/Actual)-[:PLANNEDONPROJECT]->(Project/선종)'

  query_node_selection:
    진행중_작업_계획기준: 'MonthlyAssemblyPlan (plannedStart <= 기준일 <= plannedEnd)'
    작업_실적_완료: 'WorkStageActual (actualEndDate 기준)'
    블록_공정_계획: 'BlockProcessPlan'
    블록_공정_실적: 'BlockProcessActual'
    기준계획: 'BasedPlan'

  property_naming_convention: |
    모든 속성명에 'has' 접두사가 붙지만 의미상 무시한다.
    예) hasPlannedStartDate → 실질적 의미는 PlannedStartDate.
    단, 데이터 접근 시에는 hasPlannedStartDate 로 사용해야 한다.

# ═══════════════════════════════════════════════════════════════
# 엔티티 타입 정의
# ═══════════════════════════════════════════════════════════════

entity_types:
  # ─── 생산 계획 ───

  MonthlyAssemblyPlan:
    description: |
      월간 조립 계획. 블록별·공장별 착수/종료 계획일과 표준 공수를 관리한다.
      착수 지연 블록 조회 시 hasPlannedStartDate 기준으로 필터링한다.
    properties:
      hasPlannedStartDate:
        {
          type: string,
          required: true,
          description: '계획 착수일 (ISO 날짜 문자열)',
        }
      hasPlannedEndDate:
        {
          type: string,
          required: true,
          description: '계획 종료일 (ISO 날짜 문자열)',
        }
      hasStandardGrindingManHour:
        { type: string, required: false, description: '표준 그라인딩 공수(MH)' }
      hasStandardFittingManHour:
        { type: string, required: false, description: '표준 취부 공수(MH)' }
      hasStandardWeldingManHour:
        { type: string, required: false, description: '표준 용접 공수(MH)' }
      hasDelay:
        {
          type: string,
          required: false,
          description: '지연 정보 (실제 데이터 미입력 필드)',
        }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - '2357호선 Block A10 조립2공장 월간계획 (착수 2024-06-03, 종료 2024-06-14)'

  BasedPlan:
    description: |
      기준 계획. 프로젝트·블록·공장별 계획/실적 4종 날짜를 모두 보유한다.
      해외(OOS) 공장 착수·완료 지연 조회 시 MonthlyAssemblyPlan과 매칭하여 사용.
      BasedPlan 매칭은 동일 Block + 동일 Project 기준으로 수행한다.
    properties:
      hasPlannedStartDate:
        { type: string, required: true, description: '계획 착수일' }
      hasPlannedEndDate:
        { type: string, required: true, description: '계획 종료일' }
      hasActualStartDate:
        { type: string, required: false, description: '실적 착수일' }
      hasActualEndDate:
        { type: string, required: false, description: '실적 종료일' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - '2357호선 Block A10 기준계획 (계획: 2024-06-03~06-14, 실적: 2024-06-05~06-16)'

  BlockProcessPlan:
    description: |
      블록 공정 계획. 블록별 세부 공정 단계(절단, 소조립, 중조립 등)의 계획 일정.
      지연 판단 시 BlockProcessActual과 비교하여 착수/완료 지연을 산출한다.
    properties:
      hasPlannedStartDate:
        { type: string, required: true, description: '계획 착수일' }
      hasPlannedEndDate:
        { type: string, required: true, description: '계획 종료일' }
      hasActualStartDate:
        { type: string, required: false, description: '실적 착수일' }
      hasActualEndDate:
        { type: string, required: false, description: '실적 종료일' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false

  # ─── 생산 실적 ───

  WorkStageActual:
    description: |
      작업 단계 실적. 공장별·블록별 실제 착수/종료 일자를 기록한다.
      '작업 실적/완료' 조회 시 사용한다.
      주의: 속성이 희소(sparse)하여 많은 노드가 uri만 보유하고, 날짜 속성은 일부 노드에만 존재한다.
    properties:
      hasActualStartDateByStaff:
        {
          type: string,
          required: false,
          description: '실적 착수일 (현장 입력, 희소)',
        }
      hasActualEndDateByStaff:
        {
          type: string,
          required: false,
          description: '실적 종료일 (현장 입력, 희소)',
        }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false

  BlockProcessActual:
    description: |
      블록 공정 실적. 블록별 세부 공정의 실제 진행 일자를 기록한다.
      실적 종료일은 coalesce(hasAdjustedActualEndDate, hasActualEndDateByStaff) 로 결정한다.
      지연 판단: 착수 지연 = hasActualStartDateByStaff > BlockProcessPlan.hasPlannedStartDate
                완료 지연 = hasActualEndDateByStaff > BlockProcessPlan.hasPlannedEndDate
    properties:
      hasActualStartDateByStaff:
        {
          type: string,
          required: false,
          description: '실적 착수일 (현장 입력)',
        }
      hasActualEndDateByStaff:
        {
          type: string,
          required: false,
          description: '실적 종료일 (현장 입력)',
        }
      hasAdjustedActualStartDate:
        { type: string, required: false, description: '보정 실적 착수일' }
      hasAdjustedActualEndDate:
        { type: string, required: false, description: '보정 실적 종료일' }
      hasPlannedStartDateByStaff:
        {
          type: string,
          required: false,
          description: '계획 착수일 (현장 입력)',
        }
      hasPlannedEndDateByStaff:
        {
          type: string,
          required: false,
          description: '계획 종료일 (현장 입력)',
        }
      hasRequestedInspectionDate:
        { type: string, required: false, description: '검사 요청일' }
      hasConfirmedInspectionDate:
        { type: string, required: false, description: '검사 확정일' }
      display: { type: string, required: false, description: '표시명' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false

  # ─── 선박/프로젝트 ───

  Project:
    description: |
      건조 프로젝트(호선). URI 끝의 숫자가 호선 번호이다.
      예: uri="...#Proj_2357" → 2357호선.
      선종은 노드의 추가 레이블로 표현된다 (ChemicalTanker, ContainerCarrier 등).
    properties:
      uri:
        {
          type: string,
          required: true,
          description: '고유 식별자(URI) — 호선 번호 포함',
        }
      display: { type: string, required: false, description: '표시명' }
      project_id: { type: string, required: false, description: '프로젝트 ID' }
    state_tracking: false
    examples:
      - '2357호선 (uri: ...#Proj_2357)'
      - '2410호선 케미컬 탱커 (레이블: Project + ChemicalTanker)'

  BulkCarrier:
    description: '프로젝트 선종 레이블: 벌크선'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  ChemicalTanker:
    description: '프로젝트 선종 레이블: 케미컬 탱커'
    properties:
      display: { type: string, required: false, description: '표시명' }
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  ContainerCarrier:
    description: '프로젝트 선종 레이블: 컨테이너선'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  LPGCarrier:
    description: '프로젝트 선종 레이블: LPG 운반선'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  OilCarrier:
    description: '프로젝트 선종 레이블: 유조선'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  OreBulkOilCarrier:
    description: '프로젝트 선종 레이블: 광유겸용선(OBO)'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  SpecialShip:
    description: '프로젝트 선종 레이블: 특수선'
    properties:
      uri: { type: string, required: false, description: '고유 식별자' }
    state_tracking: false

  Block:
    description: |
      선체 블록 — 건조 분할 단위.
      소조립 → 중조립 → 대조립 → PE(선행의장) → 탑재 순서로 진행.
      hasCode가 블록 식별 코드이며, 숫자(434) 또는 영숫자(40D, 20A) 형태.
      URI 패턴: http://hanwha.com/ocean#Block_{호선}_{코드}
    properties:
      hasCode:
        {
          type: string,
          required: true,
          description: '블록 코드 (예: 434, 40D, 20A, 101)',
        }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - 'Block 434 (hasCode: 434)'
      - 'Block 40D (hasCode: 40D)'
      - 'Block 101 (hasCode: 101)'

  # ─── 공장/시설 ───

  InsideShop:
    description: |
      사내 공장. 조립·도장·절단·의장 등 용도별 불리언 플래그로 분류.
      공장 코드: hasCode, 공장 이름: comment.
      URI 패턴: http://hanwha.com/ocean#Shop_{코드}
    properties:
      hasCode:
        {
          type: string,
          required: true,
          description: '공장 코드 (예: TSO, POS, OFE)',
        }
      comment:
        {
          type: string,
          required: false,
          description: '공장명 (한국어, 예: 특수선 옥외공장)',
        }
      isAssemblyShop:
        {
          type: string,
          required: false,
          description: "조립공장 여부 (STRING 'True'/'False')",
        }
      isPaintingShop:
        {
          type: string,
          required: false,
          description: "도장공장 여부 (STRING 'True'/'False')",
        }
      isCuttingShop:
        {
          type: string,
          required: false,
          description: "절단공장 여부 (STRING 'True'/'False')",
        }
      isErectionShop:
        {
          type: string,
          required: false,
          description: "안벽(탑재)공장 여부 (STRING 'True'/'False')",
        }
      isOutfittingShop:
        {
          type: string,
          required: false,
          description: "의장공장 여부 (STRING 'True'/'False')",
        }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - "특수선 옥외공장 (hasCode: TSO, isAssemblyShop: 'True')"

  OutsideShop:
    description: |
      사외 공장(국내 협력사). 사내공장과 동일한 용도별 플래그 체계.
      예: (주)유일(YUL), 영창중공업(YCH), STX중공업(STX) 등.
    properties:
      hasCode:
        {
          type: string,
          required: true,
          description: '공장 코드 (예: YUL, YCH, STX)',
        }
      comment:
        { type: string, required: false, description: '공장명 (예: (주)유일)' }
      isAssemblyShop:
        {
          type: string,
          required: false,
          description: "조립공장 여부 (STRING 'True'/'False')",
        }
      isPaintingShop:
        { type: string, required: false, description: '도장공장 여부' }
      isCuttingShop:
        { type: string, required: false, description: '절단공장 여부' }
      isErectionShop:
        { type: string, required: false, description: '안벽(탑재)공장 여부' }
      isOutfittingShop:
        { type: string, required: false, description: '의장공장 여부' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false

  OverseaShop:
    description: |
      해외(OOS) 공장. 주요 코드: DSC(중국 DSSC), NGV(말레이시아), DMC(중국 대련조선), DBJ(중국 대련동방정공), ANG(앙골라).
      해외 공장 착수·완료 지연 조회 시 MonthlyAssemblyPlan + BasedPlan 조합으로 산출.
    properties:
      hasCode:
        {
          type: string,
          required: true,
          description: '공장 코드 (DSC, NGV, DMC, DBJ, ANG)',
        }
      comment:
        {
          type: string,
          required: false,
          description: '공장명 (예: NGV조선소(말레이시아), 중국 DSSC)',
        }
      isAssemblyShop:
        { type: string, required: false, description: '조립공장 여부' }
      isPaintingShop:
        { type: string, required: false, description: '도장공장 여부' }
      isCuttingShop:
        { type: string, required: false, description: '절단공장 여부' }
      isErectionShop:
        { type: string, required: false, description: '안벽(탑재)공장 여부' }
      isOutfittingShop:
        { type: string, required: false, description: '의장공장 여부' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - 'DSC 공장 (중국, hasCode: DSC)'
      - 'NGV 공장 (말레이시아, hasCode: NGV)'

  # ─── 공정/작업 단계 ───

  BlockProcess:
    description: |
      블록 공정 마스터 — 공정 단계 정의.
      주요 공정: S00(조립), W00(선행의장(B)), P00(선행도장), E00(PE), E90(탑재), X00(사외).
    properties:
      hasCode:
        {
          type: string,
          required: true,
          description: '공정 코드 (예: S00, W00, P00, E00, E90)',
        }
      hasName:
        {
          type: string,
          required: false,
          description: '공정명 (예: 조립, 선행의장(B), PE, 탑재)',
        }
      hasSeq:
        {
          type: string,
          required: false,
          description: '순번 (공정 순서, 예: 20=조립, 80=선행도장, 200=PE, 400=탑재)',
        }
      comment: { type: string, required: false, description: '공정 설명' }
      uri: { type: string, required: false, description: '고유 식별자(URI)' }
    state_tracking: false
    examples:
      - 'S00: 조립 (seq=20)'
      - 'P00: 선행도장 (seq=80)'
      - 'E00: PE (seq=200)'
      - 'E90: 탑재 (seq=400)'

  WorkStageType:
    description: |
      작업 단계 타입. 계획/실적 노드가 HASWORKSTAGETYPE 관계로 참조한다.

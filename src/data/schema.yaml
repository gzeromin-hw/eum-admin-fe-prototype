  Issue:
    description: |
      생산 과정에서 발생한 이슈, 리스크, 부적합(NCR).
      프로젝트(선종)가 HAS_ISSUE 관계로 소유하며,
      원인(Cause), 영향(Impact), 조치(Action), 증빙(DataEvidence), 부가정보(ExtraInfo)와 연결된다.
      URI 패턴: http://hanwha.com/ocean/abox/issue/{uuid}
    properties:
      title:
        { type: string, required: false, description: '이슈 제목 (한국어)' }
      issue_id: { type: string, required: false, description: '이슈 ID (UUID)' }
      issue_type:
        {
          type: string,
          required: false,
          description: '이슈 유형 (예: LD노출, 일정 단축 관리, 품질)',
        }
      category:
        {
